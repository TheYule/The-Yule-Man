[package]
name = "theyuleman"
version = "0.1.1"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
# Make sure this matches songbird's reqwest
reqwest = "0.12.28"
rig-agent = { version = "0.44.0", optional = true }
rig-llama-cpp = { version = "0.6.0", features = ["cuda"], optional = true }
serde_json = "1.0.154"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"

[dependencies.poise]
version = "0.7.1"
default-features = false
features = ["cache", "chrono", "handle_panics"]

[dependencies.songbird]
version = "0.5"
default-features = false
features = ["gateway", "serenity", "native"]

[dependencies.lavalink-rs]
version = "0.15"
default-features = false
features = ["songbird", "serenity", "tungstenite-native-tls", "macros"]

[features]
default = []
ai = ["dep:rig-agent", "dep:rig-llama-cpp"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = "symbols"
