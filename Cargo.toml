[package]
name = "theyuleman"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15.0"
poise = "0.7.1"
rig-agent = { version = "0.44.0" }
rig-llama-cpp = { version = "0.6.0", features = ["cuda"] }
songbird = "0.6.1"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }

[dependencies.symphonia]
version = "0.5.2"
features = ["all-codecs"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = "symbols"
